schema_version: 1
updated_at: 2026-08-07
id: J
name: 求职发展
status: confirmed
target_role: AI产品经理
calibration:
  location: 广州
  jd_sources: [用户提供JD, Boss直聘等真实岗位]
  note: "路线必须持续用广州真实JD校准，避免按过度先进岗位虚构要求"

stages:
  - order: 1
    id: J1
    name: 目标岗位与JD样本
    purpose: 明确岗位类型、行业、资历和现实要求
    outputs: [JD样本集, 岗位分型, 高频要求]
    horizon: 短期启动
  - order: 2
    id: J2
    name: 能力地图
    purpose: 将JD要求映射为产品、AI、数据、工程协作和业务能力
    outputs: [能力矩阵, 要求证据映射]
    horizon: 短期启动
  - order: 3
    id: J3
    name: 差距与优先级
    purpose: 区分必须补齐、作品证明和可选加分项
    outputs: [差距清单, 学习路线联动项]
    horizon: 短期启动
  - order: 4
    id: J4
    name: 作品与证据
    purpose: 为岗位要求准备功利且可核验的成果
    outputs: [案例研究, PRD, 原型, Eval报告, 数据分析, 上线复盘]
    horizon: 长期规划
  - order: 5
    id: J5
    name: 简历与面试叙事
    purpose: 将跨线作品转成岗位语言和STAR故事
    outputs: [简历版本, 项目故事, 题库, 模拟面试记录]
    horizon: 长期规划
  - order: 6
    id: J6
    name: 投递与反馈闭环
    purpose: 用真实市场反馈修正目标、路线和作品
    outputs: [投递看板, 面试反馈, 路线调整决策]
    horizon: 长期规划

capability_families:
  - 产品基本功
  - 用户与业务问题定义
  - AI能力边界与方案选择
  - 数据与评测
  - Prompt/RAG/Agent应用理解
  - 工程协作与交付
  - 成本、风险、安全与合规
  - 沟通、文档与项目推进

evidence_policy:
  works_are_shared_objects: true
  separate_portfolio_line: false
  career_evidence_should_be_role_specific: true
  link_learning_and_business_outputs: true

next_inputs:
  - 用户提供若干广州AI产品经理JD
  - 对JD做真实性、资历层级与频率分析
  - 选择一个主目标岗位类型和一个备选类型
