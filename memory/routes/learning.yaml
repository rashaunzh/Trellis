schema_version: 1
updated_at: 2026-08-07
id: G
name: 学习成长
status: confirmed
default_depth: 实践
route_policy:
  depth_levels: [认识, 实践, 深入]
  resource_rule: "每阶段一门主课，按需补官方文档、实验、书籍和论文；不建立囤积清单"
  project_driven_electives: true

stages:
  - order: 1
    id: G1
    name: 计算机与开发基础
    topics: [Python, Git, CLI, 调试与测试, 文件与API, SQL, 计算机基础]
    evidence: [可运行脚本, Git仓库, API小项目]
    horizon: 短期启动
  - order: 2
    id: G2
    name: 数据、数学与机器学习
    topics: [NumPy, Pandas, 即用即学数学, 回归, 分类, 聚类, 决策树, 评估]
    evidence: [Notebook测评, 端到端ML小项目]
    horizon: 短期启动
  - order: 3
    id: G3
    name: 深度学习与PyTorch
    topics: [张量, autograd, 训练循环, 优化, 正则化, embeddings]
    evidence: [PyTorch训练项目, 实验报告]
    horizon: 长期规划
  - order: 4
    id: G4
    name: NLP、Transformer 与 LLM
    topics: [token, attention, transformer, 预训练, 指令微调, 推理]
    evidence: [概念闪卡, Transformer实现或讲解作品]
    horizon: 长期规划
  - order: 5
    id: G5
    name: LLM 应用工程
    topics: [Prompt, 结构化输出, API, embeddings, RAG, 多模态, evals]
    evidence: [带评测的RAG或AI应用]
    horizon: 长期规划
  - order: 6
    id: G6
    name: Agent 工程
    topics: [tools, state, memory, workflow, MCP, human-in-the-loop, multi-agent, recovery]
    evidence: [可观测且可恢复的Agent项目]
    horizon: 长期规划
  - order: 7
    id: G7
    name: AI 产品与生产化
    topics: [问题定义, 能力边界, 数据闭环, 指标, 成本, 延迟, 安全, 监控]
    evidence: [PRD, 评测框架, 上线复盘]
    horizon: 长期规划
  - order: 8
    id: G8
    name: 项目与JD驱动选修
    topics: [微调, LoRA, DPO, 部署, vLLM, 多模态, 强化学习, MLOps]
    evidence: [与目标项目或岗位直接相关的专项成果]
    horizon: 暂停

